[package]
name = "phlow-trainlab"
version = "0.1.0"
edition = "2024"
description = "Executable-reward post-training experiment harness for phlow: frozen task splits, bounded reward execution, RLOO group statistics, pass@k, selection/confirmation discipline, and run receipts. EXPERIMENTAL — measures and records; it does not update model weights."
license = "Apache-2.0"

[lib]
name = "phlow_trainlab"
path = "src/lib.rs"

[[bin]]
name = "phlow-trainlab"
path = "src/main.rs"

[dependencies]
# serde/serde_json: receipt, ledger, harness, and Ollama wire formats.
# Validation never relies on derive; every boundary value is checked.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# sha2: SHA-256 fingerprints for run configs and receipts, pinned exact to
# match phlow-experiment's pin.
sha2 = "=0.10.9"

# phlow-seccomp: the Linux egress filter (socket(AF_INET/AF_INET6) and
# io_uring_setup -> EPERM) installed in every reward-executor child, the
# same filter phlow-checks installs. Its one unsafe pre_exec lives there.
[target.'cfg(target_os = "linux")'.dependencies]
phlow-seccomp = { version = "0.1.0", path = "../phlow-seccomp" }
