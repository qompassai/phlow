[package]
name = "phlow-gauntlet"
version = "0.1.0"
edition = "2024"
description = "65-task agent-orchestration proving ground for phlow: task drivers, failure recorder, and report CLI. EXPERIMENTAL — drives only test doubles and headless Neovim; enables no production behavior."
license = "MIT OR Apache-2.0"

[lib]
name = "phlow_gauntlet"
path = "src/lib.rs"

[[bin]]
name = "gauntlet"
path = "src/bin/gauntlet.rs"

[dependencies]
# phlow-experiment: the real evaluator under test (evaluator.rs budget
# discipline). Path dependency, same workspace.
phlow-experiment = { path = "../phlow-experiment" }
# phlow-council: the real council arbitration under test (review.rs vote
# tally). Path dependency, same workspace.
phlow-council = { path = "../phlow-council" }
# phlow-runtime: the real msgpack transport under test for task-25
# (transport/msgpack.rs bounded mpsc worker channel). Path dependency,
# same workspace.
phlow-runtime = { path = "../phlow-runtime" }
# phlow-editor: the EditorTransport trait + contract constants the
# task-25 driver speaks through. Path dependency, same workspace.
phlow-editor = { path = "../phlow-editor" }
# phlow-llm: the real downstream-call wrapper under test for task-26/27
# (OllamaBackend::chat -> LlmTransport::post_chat). Path dependency,
# same workspace.
phlow-llm = { path = "../phlow-llm" }
# phlow-config: OllamaConfig for the task-26/27 backend fixtures. Direct
# dependency (used by name); also pulled transitively via phlow-llm.
phlow-config = { path = "../phlow-config" }
# phlow-json: the real checked JSON boundary under test for task-39
# (parse_limited: input cap + depth bound + typed errors). Path
# dependency, same workspace.
phlow-json = { path = "../phlow-json" }
# phlow-agent: the real Online Context Compact under test for task-46
# (solpi::context_compact::evaluate_compaction). Path dependency, same
# workspace.
phlow-agent = { path = "../phlow-agent" }
# phlow-tuios: the real hook subprocess fan-out under test for task-47
# (hooks::HookManager + counting semaphores) and the real mailbox ring
# under test for task-50 (mailbox::Mailbox). Path dependency, same
# workspace.
phlow-tuios = { path = "../phlow-tuios" }
# rmpv: the scripted msgpack-RPC socket peer in the task-25 driver —
# the same codec the transport uses. No derive-based validation.
rmpv = "1"
# serde_json: build the JSON verdict/report objects. No derive-based validation.
serde_json = "1"
# Crypto for the task-11 approval fixtures: the driver dual-signs genuine
# v2 operator records with the real crates (never hardcoded signatures).
# Same pinned versions as phlow-experiment.
ml-dsa = "=0.1.1"
ed25519-dalek = "=3.0.0"
sha2 = "=0.10.9"
