[package]
name = "phlow-gauntlet"
version = "0.1.0"
edition = "2024"
description = "20-task agent-orchestration proving ground for phlow: task drivers, failure recorder, and report CLI. EXPERIMENTAL — drives only test doubles and headless Neovim; enables no production behavior."
license = "MIT OR Apache-2.0"

[lib]
name = "phlow_gauntlet"
path = "src/lib.rs"

[[bin]]
name = "gauntlet"
path = "src/bin/gauntlet.rs"

[dependencies]
# phlow-experiment: the real evaluator under test (evaluator.rs budget
# discipline). Path dependency, same workspace.
phlow-experiment = { path = "../phlow-experiment" }
# phlow-council: the real council arbitration under test (review.rs vote
# tally). Path dependency, same workspace.
phlow-council = { path = "../phlow-council" }
# serde_json: build the JSON verdict/report objects. No derive-based validation.
serde_json = "1"
# Crypto for the task-11 approval fixtures: the driver dual-signs genuine
# v2 operator records with the real crates (never hardcoded signatures).
# Same pinned versions as phlow-experiment.
ml-dsa = "=0.1.1"
ed25519-dalek = "=3.0.0"
sha2 = "=0.10.9"
