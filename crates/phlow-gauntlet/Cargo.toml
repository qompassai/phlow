[package]
name = "phlow-gauntlet"
version = "0.1.0"
edition = "2024"
description = "130-task agent-orchestration proving ground for phlow (130 implemented): task drivers, failure recorder, and report CLI. EXPERIMENTAL — drives only test doubles and headless Neovim; enables no production behavior."
license = "MIT OR Apache-2.0"

[lib]
name = "phlow_gauntlet"
path = "src/lib.rs"

[[bin]]
name = "gauntlet"
path = "src/bin/gauntlet.rs"

[dependencies]
# phlow-experiment: the real evaluator under test (evaluator.rs budget
# discipline). Path dependency, same workspace.
phlow-experiment = { path = "../phlow-experiment" }
# phlow-council: the real council arbitration under test (review.rs vote
# tally). Path dependency, same workspace.
phlow-council = { path = "../phlow-council" }
# phlow-runtime: the real msgpack transport under test for task-25
# (transport/msgpack.rs bounded mpsc worker channel). Path dependency,
# same workspace.
phlow-runtime = { path = "../phlow-runtime" }
# phlow-editor: the EditorTransport trait + contract constants the
# task-25 driver speaks through. Path dependency, same workspace.
phlow-editor = { path = "../phlow-editor" }
# phlow-llm: the real downstream-call wrapper under test for task-26/27
# (OllamaBackend::chat -> LlmTransport::post_chat). Path dependency,
# same workspace.
phlow-llm = { path = "../phlow-llm" }
# phlow-config: OllamaConfig for the task-26/27 backend fixtures. Direct
# dependency (used by name); also pulled transitively via phlow-llm.
phlow-config = { path = "../phlow-config" }
# phlow-json: the real checked JSON boundary under test for task-39
# (parse_limited: input cap + depth bound + typed errors). Path
# dependency, same workspace.
phlow-json = { path = "../phlow-json" }
# phlow-agent: the real Online Context Compact under test for task-46
# (solpi::context_compact::evaluate_compaction). Path dependency, same
# workspace.
phlow-agent = { path = "../phlow-agent" }
# phlow-tuios: the real hook subprocess fan-out under test for task-47
# (hooks::HookManager + counting semaphores) and the real mailbox ring
# under test for task-50 (mailbox::Mailbox). Path dependency, same
# workspace.
phlow-tuios = { path = "../phlow-tuios" }
# phlow-inference: the real kv_policy precision ladder under test for
# task-77 (policy selection is KV-cache policy, not model-loading
# precision). Path dependency, same workspace.
phlow-inference = { path = "../phlow-inference" }
# phlow-mcp: the real MCP argument validator under test for task-77
# (validate_arguments on the tool schema). Path dependency, same
# workspace.
phlow-mcp = { path = "../phlow-mcp" }
# phlow-approval: the real policy/approval/delta/event subsystem under test
# for the task-209..232 and task-239..249 rescope (formerly Diver Lua
# probes). Path dependency, same workspace.
phlow-approval = { path = "../phlow-approval" }
# phlow-system1: the real System 1 risk-scoring subsystem under test
# for tasks 251-318 (RiskScorer::route over MockBackend answers).
# Path dependency, same workspace.
phlow-system1 = { path = "../phlow-system1" }
# rmpv: the scripted msgpack-RPC socket peer in the task-25 driver —
# the same codec the transport uses. No derive-based validation.
# reqwest: the real SkillOpt optimizer backend speaks Ollama's
# /api/generate over HTTP. blocking (the Optimizer trait is sync),
# rustls-webpki-roots, no default features — the same posture as
# phlow-runtime's ReqwestTransport (no proxy, no redirects). reqwest's
# /v1/chat/completions path stays in phlow-runtime; this crate needs
# /api/generate (think:false), which the runtime does not expose.
reqwest = { version = "=0.12.28", default-features = false, features = ["blocking", "json", "rustls-tls-webpki-roots"] }
# percent-encoding: encode the initial-navigation URL as the *raw*
# query component of `PUT /json/new?{url}`. The DevTools HTTP docs
# (https://chromedevtools.github.io/devtools-protocol/, "PUT /json/new
# or PUT /json/new?{url}") specify the query component itself — not a
# `url=` parameter — is parsed and URL-unescaped. Already in the
# transitive closure via reqwest -> url; pinned by the lockfile.
percent-encoding = "=2.3.2"
rmpv = "1"
# rusqlite: the session-search engine (wave 30, Ghostex zehn adaptation).
# Bundled SQLite build: no system sqlite dependency on the build host.
# Pinned =0.37.0 to match phlow-self-improve: the workspace may only
# contain one libsqlite3-sys (links = "sqlite3" forbids two copies).
rusqlite = { version = "=0.37.0", features = ["bundled"] }
# serde_json: build the JSON verdict/report objects. No derive-based validation.
serde_json = "1"
# Crypto for the task-11 approval fixtures: the driver dual-signs genuine
# v2 operator records with the real crates (never hardcoded signatures).
# Same pinned versions as phlow-experiment.
ml-dsa = "=0.1.1"
ed25519-dalek = "=3.0.0"
sha2 = "=0.10.9"

[dev-dependencies]
# phlow-cli: the wave-32 (CLI UX doctrine) drivers spawn the real `phlow`
# binary as a subprocess (help/--json/sanitization). The dev-dependency
# makes Cargo build the binary for integration tests and exposes
# `CARGO_BIN_EXE_phlow` to the wave-32 harness. Path dependency, same
# workspace.
phlow-cli = { path = "../phlow-cli" }
