[package]
name = "phlow-attention"
version = "0.1.0"
edition = "2024"
description = "Grounded joint-attention coordination for phlow agents: shared workspace saliency snapshots, focus advertisement, alignment and coordination decisions (MATE analog, arXiv:2610.06025)"
license = "MIT OR Apache-2.0"

[lib]
name = "phlow_attention"
path = "src/lib.rs"

[dependencies]
# serde: the focus/alignment wire shapes are JSON on MCP and A2A
# transports; the derive macros generate the (de)serialisation.
serde = { version = "1", features = ["derive"] }
# sha2: SHA-256 snapshot identity. Two agents may only compare foci
# computed from the same snapshot; the hash is that shared frame.
sha2 = "0.10"

[dev-dependencies]
# serde_json: wire-shape round-trip assertions in the test suites.
serde_json = "1"
