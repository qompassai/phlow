[package]
name = "phlow-experiment"
version = "0.1.0"
edition = "2024"
description = "Staged supervised-self-improvement experiment scaffolding for phlow: control-plane types, lifecycle and promotion gates, evaluator skeletons, manifest validators, and evaluation records. EXPERIMENTAL — no behavior enabled."
license = "MIT OR Apache-2.0"

[lib]
name = "phlow_experiment"
path = "src/lib.rs"

[dependencies]
# toml: manifest parsing via toml::Value with explicit validation control
# flow, mirroring phlow-config. No derive macros for validation.
toml = "0.8"
# serde/serde_json: Serialize derives for the EvaluationRecord JSON report
# schema only. Validation never relies on derive.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# ml-dsa: ML-DSA-65 post-quantum signatures (FIPS 204), the PQ half of the
# dual operator-approval signature. Pure Rust, zero unsafe (verified from
# source). Pinned exact. Default features off: the gate only verifies, so
# getrandom/pkcs8/alloc are not on the production path.
ml-dsa = { version = "=0.1.1", default-features = false }
# ed25519-dalek: Ed25519 classical signatures (RFC 8032), the classical half
# of the dual approval signature. Pinned exact. Default features off and the
# `batch` feature never enabled: the gate uses verify_strict only.
ed25519-dalek = { version = "=3.0.0", default-features = false }
# sha2: SHA-256 fingerprints for the operator-enrollment ceremony only
# (registry.rs). Never on the signature-verification path.
sha2 = "=0.10.9"

[dev-dependencies]
# Test fixtures dual-sign records with the real crates (default features),
# so every "genuine" fixture is a true positive, never hardcoded bytes.
ml-dsa = "=0.1.1"
ed25519-dalek = "=3.0.0"
sha2 = "=0.10.9"
