[package]
name = "phlow-agent"
version = "0.1.0"
description = "Bounded agent layer for the phlow runtime: conversation context, orchestrator, and SQLite FTS5 memory store"
license = "MIT OR Apache-2.0"
repository = "https://github.com/qompassai/phlow"
edition = "2024"

[dependencies]
# phlow-runtime: the safe agent runtime this crate's orchestrator drives.
phlow-runtime = { version = "0.2.0", path = "../phlow-runtime" }
# Transport traits bound the orchestrator's generics, like Runtime's own.
phlow-llm = { version = "0.2.0", path = "../phlow-llm" }
# phlow-inference: ProjectionHead trait and VectorArena for the System-1
# contrastive scorer (system1 module). No dependency cycle: phlow-inference
# depends on no workspace crates.
phlow-inference = { version = "0.1.0", path = "../phlow-inference" }
phlow-editor = { version = "0.2.0", path = "../phlow-editor" }
# serde_json: conversation and memory payloads are JSON, like Python.
serde_json = "1"
# rusqlite: SQLite FTS5 memory store (bundled build, no system SQLite).
# Pinned: the memory schema depends on exact FTS5 behavior.
rusqlite = { version = "=0.37.0", features = ["bundled"] }

[dev-dependencies]
# Test-only: build FlowConfig values for the orchestrator test.
phlow-config = { version = "0.1.0", path = "../phlow-config" }

[features]
default = []
