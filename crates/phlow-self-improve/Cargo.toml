[package]
name = "phlow-self-improve"
version = "0.1.0"
description = "Self-improvement surfaces for phlow: feedback store and read-only skill store"
license = "Apache-2.0"
repository = "https://github.com/qompassai/phlow"
edition = "2024"

[dependencies]
# serde_json: feedback row serialization (row keys preserved from Python).
serde_json = "1"
# rusqlite: the feedback store's SQLite backend. Bundled build, no system
# SQLite, same pinned version as phlow-agent's memory store. Synchronous
# access behind a Mutex: feedback recording is rare and must never spawn
# background threads or queues.
rusqlite = { version = "=0.37.0", features = ["bundled"] }
# phlow-workspace: root-pinned, read-only skill directory listing/reads for
# the read-only skill store compatibility layer.
phlow-workspace = { version = "0.2.0", path = "../phlow-workspace" }
# phlow-approval: the operator approval queue PH-3 check proposals are
# admitted to as pending records. The queue is in-memory and
# fail-closed; nothing here decides a record.
phlow-approval = { version = "0.1.0", path = "../phlow-approval" }
# phlow-flowguard: PH-7 lesson capture derives its lane labels from
# flowguard's own trajectory label type (LabelSnapshot). Types only —
# no flowguard runtime, no policy evaluation.
phlow-flowguard = { version = "0.1.0", path = "../phlow-flowguard" }

[dev-dependencies]
# bloch: PH-13's acceptance test links bloch's own BL-1 intake gate
# (bloch::outcome) so a mapped row is proven against the real gate,
# never a re-implementation. The package is `blochs`; its library
# is `bloch`. Dev-only: no shipped phlow binary depends on it.
bloch = { package = "blochs", version = "=1.0.0" }
