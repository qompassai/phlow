[package]
name = "phlow-trainer-mojo"
version = "0.1.0"
edition = "2024"
description = "Mojo scoring + sampling backend for phlow-trainlab: GPU logprob-reduction, RLOO advantage, and composable sampling kernels behind the shared trainer contract, callable from Rust over a C ABI. Not a trainer — the PyTorch sidecar stays the logits producer and trainer of record; this backend accelerates scoring/sampling and records scoring receipts."
license = "MIT OR Apache-2.0"
publish = false

[lib]
name = "phlow_trainer_mojo"
path = "src/lib.rs"

[[bin]]
name = "phlow-trainer-mojo"
path = "src/main.rs"

[features]
# The production backend surface (backend dispatch + groups/receipt
# contract run). On by default; the PyTorch sidecar remains
# trainlab's default backend — this feature only makes the Mojo
# backend selectable, it changes nothing in phlow-trainlab.
default = ["trainlab-contract"]
trainlab-contract = ["dep:phlow-trainlab"]

[dependencies]
# phlow-trainlab: the shared contract types (groups export +
# receipt validation) the production run consumes — the same
# dependency direction as the Candle/Burn trainer backends.
phlow-trainlab = { path = "../phlow-trainlab", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# sha2: receipt/input hashing, pinned exact to match phlow-trainlab.
sha2 = "=0.10.9"
