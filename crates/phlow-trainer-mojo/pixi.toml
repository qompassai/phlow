[workspace]
name = "phlow-trainer-mojo"
channels = ["https://conda.modular.com/max", "conda-forge"]
platforms = ["linux-64"]

[dependencies]
max = "26.5.*"
python = "3.12.*"
cuda-toolkit = ">=12.0,<14"

# transformers/huggingface-hub/numpy/safetensors serve tools/;
# requests..llguidance are the MAX-probe dependency tail (see tools/probe_max.py).
[pypi-dependencies]
transformers = ">=5.19.0, <6"
huggingface-hub = ">=1.33.0, <2"
numpy = "*"
safetensors = ">=0.8.0, <0.9"
requests = ">=2.34.2, <3"
pydantic = ">=2.14.0, <3"
msgspec = "*"
pillow = ">=12.3.0, <13"
av = ">=19.0.1, <20"
llguidance = ">=1.9.1, <2"
